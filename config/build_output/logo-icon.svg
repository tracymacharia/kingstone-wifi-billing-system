<svg width="64" height="64" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D32F2F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B71C1C;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="logoYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FBC02D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F9A825;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="logoBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1976D2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1565C0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- WiFi Arcs - Kenya flag colors -->
  <path d="M 50 20 A 30 30 0 0 1 80 50" 
        fill="none" 
        stroke="url(#logoRed)" 
        stroke-width="5" 
        stroke-linecap="round"/>
  
  <path d="M 50 28 A 22 22 0 0 1 72 50" 
        fill="none" 
        stroke="url(#logoYellow)" 
        stroke-width="5" 
        stroke-linecap="round"/>
  
  <path d="M 50 36 A 14 14 0 0 1 64 50" 
        fill="none" 
        stroke="url(#logoBlue)" 
        stroke-width="5" 
        stroke-linecap="round"/>
  
  <!-- Central Hub with K -->
  <circle cx="50" cy="50" r="12" fill="url(#logoBlue)"/>
  <circle cx="50" cy="50" r="9" fill="url(#logoRed)"/>
  
  <!-- Stylized K -->
  <path d="M 47 46 L 47 54 M 47 50 L 53 46 M 47 50 L 53 54" 
        stroke="#FFFFFF" 
        stroke-width="1.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        fill="none"/>
</svg>
