<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Kingstone Brand Gradients -->
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D32F2F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B71C1C;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="yellowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FBC02D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F9A825;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1976D2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1565C0;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="wifiGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1976D2;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Shadow Filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background Circle with subtle gradient -->
  <circle cx="200" cy="200" r="190" fill="url(#blueGradient)" opacity="0.05"/>
  <circle cx="200" cy="200" r="180" fill="none" stroke="url(#blueGradient)" stroke-width="2" opacity="0.3"/>
  
  <!-- Outer WiFi Signal Arcs (Kenya Flag inspired arrangement) -->
  <path d="M 200 85 A 115 115 0 0 1 315 200" 
        fill="none" 
        stroke="url(#redGradient)" 
        stroke-width="14" 
        stroke-linecap="round"
        filter="url(#glow)"
        opacity="0.9"/>
  
  <path d="M 200 115 A 85 85 0 0 1 285 200" 
        fill="none" 
        stroke="url(#yellowGradient)" 
        stroke-width="14" 
        stroke-linecap="round"
        filter="url(#glow)"
        opacity="0.9"/>
  
  <path d="M 200 145 A 55 55 0 0 1 255 200" 
        fill="none" 
        stroke="url(#blueGradient)" 
        stroke-width="14" 
        stroke-linecap="round"
        filter="url(#glow)"
        opacity="0.9"/>
  
  <!-- Central Hub - Represents connectivity and technology -->
  <circle cx="200" cy="200" r="35" fill="url(#blueGradient)" filter="url(#glow)"/>
  <circle cx="200" cy="200" r="28" fill="url(#redGradient)"/>
  
  <!-- Inner K for Kingstone - stylized as connectivity node -->
  <path d="M 192 188 L 192 212 M 192 200 L 208 188 M 192 200 L 208 212" 
        stroke="#FFFFFF" 
        stroke-width="4" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        fill="none"/>
  
  <!-- Connection dots at arc ends -->
  <circle cx="315" cy="200" r="6" fill="url(#redGradient)" filter="url(#glow)"/>
  <circle cx="285" cy="200" r="6" fill="url(#yellowGradient)" filter="url(#glow)"/>
  <circle cx="255" cy="200" r="6" fill="url(#blueGradient)" filter="url(#glow)"/>
  
  <!-- Signal waves emanating from center -->
  <circle cx="200" cy="200" r="50" fill="none" stroke="#1976D2" stroke-width="1" opacity="0.2">
    <animate attributeName="r" values="50;70;50" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="200" r="50" fill="none" stroke="#D32F2F" stroke-width="1" opacity="0.2">
    <animate attributeName="r" values="50;70;50" dur="3s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0;0.2" dur="3s" begin="1s" repeatCount="indefinite"/>
  </circle>
</svg>
