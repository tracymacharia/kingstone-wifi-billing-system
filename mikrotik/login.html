
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="3; url=http://YOUR_DOMAIN_HERE/portal/$(identity)?mac=$(mac)&ip=$(ip)&router_id=MIKROTIK_$(identity)&link_login=$(link-login-only)&link_orig=$(link-orig)">
    <title>Yobrazlyan WiFi - Connecting...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #D32F2F 0%, #FBC02D 50%, #1976D2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }
        
        .container {
            max-width: 400px;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            color: #333;
            backdrop-filter: blur(10px);
        }
        
        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            background: linear-gradient(135deg, #D32F2F, #FBC02D);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            color: white;
        }
        
        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #D32F2F, #FBC02D);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 2rem;
            font-size: 1rem;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #D32F2F;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 1rem auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .status {
            color: #666;
            font-size: 0.9rem;
            margin-top: 1rem;
        }
        
        .manual-link {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, #D32F2F, #FBC02D);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: transform 0.2s;
        }
        
        .manual-link:hover {
            transform: translateY(-2px);
        }
        
        .info {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: #666;
        }
        
        @media (max-width: 480px) {
            .container {
                margin: 1rem;
                padding: 1.5rem;
            }
            
            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Y</div>
        <h1>Yobrazlyan WiFi</h1>
        <p class="subtitle">Connecting you to the internet...</p>
        
        <div class="spinner"></div>
        <p class="status">Redirecting to payment portal...</p>
        
        <a href="https://billing.yobrazlyan.com/portal/$(identity)?mac=$(mac)&ip=$(ip)&router_id=MIKROTIK_$(identity)&link_login=$(link-login-only)&link_orig=$(link-orig)" class="manual-link">
            Continue Manually
        </a>
        
        <div class="info">
            <strong>Connection Info:</strong><br>
            MAC: $(mac)<br>
            IP: $(ip)<br>
            Router: $(identity)
        </div>
    </div>
    
    <script>
        // Fallback redirect if meta refresh fails
        setTimeout(function() {
            if (!document.hidden) {
                window.location.href = "https://billing.yobrazlyan.com/portal/$(identity)?mac=$(mac)&ip=$(ip)&router_id=MIKROTIK_$(identity)&link_login=$(link-login-only)&link_orig=$(link-orig)";
            }
        }, 5000);
        
        // Show connection status
        document.addEventListener('DOMContentLoaded', function() {
            const status = document.querySelector('.status');
            let dots = 0;
            
            setInterval(function() {
                dots = (dots + 1) % 4;
                status.textContent = 'Redirecting to payment portal' + '.'.repeat(dots);
            }, 500);
        });
    </script>
</body>
</html>
