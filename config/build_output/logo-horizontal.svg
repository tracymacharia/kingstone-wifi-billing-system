<svg width="500" height="120" viewBox="0 0 500 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brandRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D32F2F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B71C1C;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="brandYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FBC02D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F9A825;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="brandBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1976D2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1565C0;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1976D2;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1565C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D47A1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon (left side) -->
  <g transform="translate(10, 10)">
    <!-- WiFi Arcs -->
    <path d="M 50 20 A 30 30 0 0 1 80 50" 
          fill="none" 
          stroke="url(#brandRed)" 
          stroke-width="5" 
          stroke-linecap="round"/>
    
    <path d="M 50 28 A 22 22 0 0 1 72 50" 
          fill="none" 
          stroke="url(#brandYellow)" 
          stroke-width="5" 
          stroke-linecap="round"/>
    
    <path d="M 50 36 A 14 14 0 0 1 64 50" 
          fill="none" 
          stroke="url(#brandBlue)" 
          stroke-width="5" 
          stroke-linecap="round"/>
    
    <!-- Central Hub -->
    <circle cx="50" cy="50" r="12" fill="url(#brandBlue)"/>
    <circle cx="50" cy="50" r="9" fill="url(#brandRed)"/>
    
    <!-- K letter -->
    <path d="M 47 46 L 47 54 M 47 50 L 53 46 M 47 50 L 53 54" 
          stroke="#FFFFFF" 
          stroke-width="1.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          fill="none"/>
  </g>
  
  <!-- Text (right side) -->
  <text x="110" y="55" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="url(#textGradient)">
    KINGSTONE
  </text>
  <text x="110" y="85" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#666666" letter-spacing="2">
    WiFi BILLING SYSTEM
  </text>
  
  <!-- Decorative line -->
  <line x1="110" y1="95" x2="480" y2="95" stroke="url(#brandRed)" stroke-width="2" stroke-linecap="round"/>
</svg>
